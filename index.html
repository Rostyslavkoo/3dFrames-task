<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>3dframes-task</title>
	</head>
	<body>
		<div id="ui-panel">
			<h1>Розміри навісу</h1>

			<label for="input-width">Ширина (м)</label>
			<input id="input-width" type="number" min="2" max="8" step="0.1" value="3" />

			<label for="input-height">Висота (м)</label>
			<input id="input-height" type="number" min="2" max="8" step="0.1" value="2.2" />

			<label for="input-depth">Глибина (м)</label>
			<input id="input-depth" type="number" min="2" max="8" step="0.1" value="5" />

			<p id="input-hint">Допустимий діапазон: 2-8 м</p>
		</div>

		<canvas id="scene-canvas"></canvas>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
